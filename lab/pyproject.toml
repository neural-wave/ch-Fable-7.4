[project]
name = "neuronlab"
version = "0.1.0"
description = "Rule discovery lab for the Neuron migration challenge: profiling, clustering, optimal trees, candidate pool, exact scoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.20,<2",
    "pyarrow>=17",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "desbordante>=2.5",
]

[project.optional-dependencies]
gosdt = ["gosdt>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "radon>=6"]

[project.scripts]
lab = "neuronlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuronlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
